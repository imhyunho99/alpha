name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 > /dev/null
          python -m pip install --upgrade pip
          pip install -r requirements.docker.txt
          pip install pytest pytest-asyncio httpx ruff PySide6

      - name: Lint (ruff)
        run: ruff check alpha alpha_server tests || true

      - name: Run tests
        env:
          ALPHA_JWT_SECRET: test-secret-do-not-use-in-prod
          QT_QPA_PLATFORM: offscreen
        # 전체를 돌린다. 예전엔 7개 파일만 돌려 실계좌·실주문 안전장치 테스트가 CI 에서 빠져 있었다(10/9 발견).
        # test_scheduler 는 main 에서도 2분 넘게 멈추는 기존 문제라 뺀다.
        run: |
          pytest tests --ignore=tests/test_scheduler.py -q -o faulthandler_timeout=120

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: alpha-server:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
